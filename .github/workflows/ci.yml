name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check, Lint & Native Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Validate Cargo, npm, and release versions
        run: |
          CARGO_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          NPM_VERSION=$(node -p "require('./package.json').version")
          test "$CARGO_VERSION" = "$NPM_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "${{ github.event.release.tag_name }}" = "v${NPM_VERSION}"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --check

      - name: Cargo check (wasm)
        run: cargo check --locked --target wasm32-unknown-unknown --all-features

      - name: Cargo build
        run: cargo build --locked --all-targets --all-features

      - name: Clippy (wasm)
        run: cargo clippy --locked --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Native tests
        run: cargo test --locked --all-features

      - name: Documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --all-features --no-deps

      - name: Package and publish dry-run
        run: |
          cargo package --locked
          cargo publish --dry-run --locked --no-verify

  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: 1.75.0
          targets: wasm32-unknown-unknown

      - name: Check native code
        run: cargo check --locked --all-targets --all-features

      - name: Test native-compatible code
        run: cargo test --locked --all-features

      - name: Check WASM target
        run: cargo check --locked --target wasm32-unknown-unknown --all-features

  test:
    name: Test (wasm-bindgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (headless Chrome)
        run: wasm-pack test --headless --chrome -- --all-features

  features:
    name: Feature Export Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Verify feature-gated exports
        run: node scripts/check-feature-exports.mjs

  build:
    name: Build, Package & Size Check
    runs-on: ubuntu-latest
    needs: [check, msrv, test, features]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm tooling
        run: npm ci

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: npm run build

      - name: Pack and smoke-test publish artifact
        run: |
          mkdir -p release-artifacts
          TARBALL=$(npm pack --ignore-scripts --json --pack-destination release-artifacts | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename));")
          node scripts/package-smoke.mjs "./release-artifacts/${TARBALL}"
          npm publish --dry-run --ignore-scripts "./release-artifacts/${TARBALL}"

      - name: Check bundle size
        run: |
          WASM_FILE=pkg/ojs_wasm_sdk_bg.wasm
          GZIP_BUDGET=151552
          RAW_SIZE=$(wc -c < "$WASM_FILE" | tr -d ' ')
          GZIP_SIZE=$(gzip -cn "$WASM_FILE" | wc -c | tr -d ' ')
          {
            echo "## Bundle Size"
            echo "| File | Raw | Gzipped | Budget |"
            echo "|------|-----|---------|--------|"
            echo "| \`ojs_wasm_sdk_bg.wasm\` | ${RAW_SIZE} bytes | ${GZIP_SIZE} bytes | ${GZIP_BUDGET} bytes |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Raw:  ${RAW_SIZE} bytes"
          echo "Gzip: ${GZIP_SIZE} bytes"
          if [ "$GZIP_SIZE" -gt "$GZIP_BUDGET" ]; then
            echo "::error::WASM bundle exceeds the 148 KiB regression budget (${GZIP_SIZE} > ${GZIP_BUDGET} bytes)"
            exit 1
          fi
          echo "Bundle size OK (${GZIP_SIZE} <= ${GZIP_BUDGET} bytes)"

      - name: Upload pkg artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ojs-wasm-pkg
          path: pkg/
          retention-days: 7

      - name: Upload publish artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ojs-wasm-release
          path: release-artifacts/*.tgz
          retention-days: 7

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable

      - name: Run benchmarks
        run: cargo bench --locked

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ojs-wasm-release
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate release version
        run: |
          VERSION=$(node -p "require('./release-artifacts/package/package.json').version" 2>/dev/null || true)
          if [ -z "$VERSION" ]; then
            TARBALL=$(find release-artifacts -name '*.tgz' -type f -print -quit)
            VERSION=$(tar -xOf "$TARBALL" package/package.json | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data).version));")
          fi
          test "${{ github.event.release.tag_name }}" = "v${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create checksums
        run: shasum -a 256 release-artifacts/*.tgz > release-artifacts/checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          artifact-name: ojs-wasm-sbom.spdx.json
          output-file: release-artifacts/ojs-wasm-sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release-artifacts/*.tgz

      - name: Publish
        run: npm publish ./release-artifacts/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach release artifacts
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            release-artifacts/*.tgz
            release-artifacts/*.json
            release-artifacts/checksums.txt

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
