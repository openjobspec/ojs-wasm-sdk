[package]
name = "ojs-wasm-sdk"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "OJS (Open Job Spec) client SDK compiled to WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/openjobspec/ojs-wasm-sdk"
keywords = ["jobs", "queue", "wasm", "webassembly", "ojs"]
categories = ["wasm", "web-programming"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = [
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
    "EventSource",
    "MessageEvent",
    "Event",
] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = ["edge_all", "service_worker", "encryption", "schema"]
edge_cloudflare = []
edge_deno = []
edge_vercel = []
edge_all = ["edge_cloudflare", "edge_deno", "edge_vercel"]
service_worker = []
encryption = ["dep:aes-gcm", "dep:getrandom"]
schema = []

[dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features", "--converge"]

[[bench]]
name = "serialization"
harness = false
